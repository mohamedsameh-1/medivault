name: medivault
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_bloc: ^8.1.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  easy_localization: ^3.0.7
  get_it: ^7.7.0
  injectable: ^2.4.4
  flutter_svg: ^2.0.10+1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  dartz: ^0.10.1
  connectivity_plus: ^7.3.1
  cloud_firestore: ^6.9.0
  shared_preferences: ^2.5.3
  skeletonizer: ^3.0.0
  animated_text_kit: ^4.3.0
  font_awesome_flutter: ^11.0.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/translations/
